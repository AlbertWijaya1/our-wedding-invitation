name: Prepare Our Journey photo updates

on:
  push:
    branches:
      - "photo-updates/**"
    paths:
      - ".github/workflows/optimize-journey-gallery.yml"
      - "scripts/optimize-journey-gallery.py"
      - "data/scenes.js"
      - "images/adventures/*.jpg"
      - "images/adventures/*.JPG"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: optimize-journey-gallery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the photo update branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processing library
        run: python -m pip install --upgrade Pillow

      - name: Build the gallery list and optimized photo copies
        run: python scripts/optimize-journey-gallery.py

      - name: Commit generated images and gallery list back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/adventures/ data/scenes.js
          if git diff --cached --quiet; then
            echo "No generated image or gallery-list changes to commit."
          else
            git commit -m "Generate optimized Our Journey photo images [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Open or update a pull request to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr=$(gh pr list --state open --base main --head "${GITHUB_REF_NAME}" --json url --jq '.[0].url')
          if [ -n "$existing_pr" ]; then
            echo "Pull request already exists: $existing_pr"
          else
            gh pr create \
              --base main \
              --head "${GITHUB_REF_NAME}" \
              --title "Update Our Journey photos" \
              --body "Photo update prepared automatically. Numbered JPG filenames determine the album order. Please test the updated album before merging. Original JPG photos are preserved."
          fi
